name: Release Creation

on:
  push:
    tags:
      - "release-*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Load module manifest
        id: manifest
        run: |
          # create step outputs for the module.json properties we care about
          echo "version=$(jq -r '.version' module.json)" >> $GITHUB_OUTPUT
          echo "compatibility_minimum=$(jq -r '.compatibility.minimum' module.json)" >> $GITHUB_OUTPUT
          echo "compatibility_verified=$(jq -r '.compatibility.verified' module.json)" >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url' module.json)" >> $GITHUB_OUTPUT
          echo "manifest=$(jq -r '.manifest' module.json)" >> $GITHUB_OUTPUT
          echo "download=$(jq -r '.download' module.json)" >> $GITHUB_OUTPUT

      # Set up our some variables for future use
      # Adapted from https://github.community/t/how-to-get-just-the-tag-name/16241/7
      # Tag name: ${{ env.TAG_NAME }}
      # Zip name: ${{ env.ZIP_NAME }}
      # Expected Release Download URL: ${{ env.RELEASE_DOWNLOAD_URL }}
      # Expected Release module.json URL: ${{ env.RELEASE_INSTALL_URL }}
      - name: Set up variables
        id: get_vars
        run: |
          TAG=${GITHUB_REF/refs\/tags\//}
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "ZIP_NAME=more-text-options.zip" >> $GITHUB_ENV
          echo "RELEASE_DOWNLOAD_URL=https://github.com/${{github.repository}}/releases/download/$TAG/more-text-options.zip" >> $GITHUB_ENV
          echo "RELEASE_INSTALL_URL=https://github.com/${{github.repository}}/releases/latest/download/module.json" >> $GITHUB_ENV

      # Run some tests to make sure our `module.json` is correct
      # Exit before setting up node if not
      - name: Verify correct naming
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
          RELEASE_DOWNLOAD: ${{ env.RELEASE_DOWNLOAD_URL }}
          PACKAGE_VERSION: ${{ steps.manifest.outputs.version }}
          PACKAGE_DOWNLOAD: ${{ steps.manifest.outputs.download }}
        run: |
          # Validate that the tag being released matches the package version.
          if [[ ! $TAG_NAME == release-$PACKAGE_VERSION ]]; then
            echo "The module.json version does not match tag name."
            echo "module.json: $PACKAGE_VERSION"
            echo "tag name: $TAG_NAME"
            echo "Please fix this and push the tag again."
            exit 1
          fi

          # Validate that the package download url matches the release asset that will be created.
          if [[ ! $RELEASE_DOWNLOAD == $PACKAGE_DOWNLOAD ]]; then
            echo "The module.json download url does not match the created release asset url."
            echo "module.json: $PACKAGE_DOWNLOAD"
            echo "release asset url: $RELEASE_DOWNLOAD"
            echo "Please fix this and push the tag again."
            exit 1
          fi

      # Create a zip file with all files required by the module to add to the release
      - run: zip ${{ env.ZIP_NAME }} -r scripts LICENSE.md README.md CHANGELOG.md module.json

      # Create a release for this specific version
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false # Set this to false if you want to prevent updating existing releases
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./${{ env.ZIP_NAME }}"
          tag: ${{ env.TAG_NAME }}
          body: |
            **Installation:** To manually install this release, please use the following manifest URL: ${{ env.RELEASE_INSTALL_URL }}

      - name: Publish release
        uses: neovatar/foundry-package-release@v20260712144538
        with:
          token: ${{ secrets.FVTTP_TOKEN }}
          id: ${{ steps.manifest.outputs.id }}
          version: ${{ steps.manifest.outputs.version }}
          manifest: ${{ steps.manifest.outputs.manifest }}
          notes: https://github.com/neovatar/more-text-options/blob/${{ steps.manifest.outputs.version }}/CHANGELOG.md
          compat_min: ${{ steps.manifest.outputs.compatibility_minimum }}
          compat_verified: ${{ steps.manifest.outputs.compatibility_verified }}
          dry_run: "false"
